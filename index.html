<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

     <!-- Preconnect to third-party domains -->
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://fast.wistia.net" crossorigin />
  <link rel="preconnect" href="https://api.factors.ai" crossorigin />
  <link rel="dns-prefetch" href="https://www.clarity.ms" />

  <!-- Font display optimization - Critical fonts only -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap" media="print"
    onload="this.media='all'" />

  <!-- Defer non-critical fonts -->
  <link rel="preload"
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500&family=Montserrat:wght@500;600&family=Nunito:wght@400;500&display=swap"
    as="style" onload="this.onload=null;this.rel='stylesheet'" />
  <noscript>
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Montserrat:wght@500;600&family=Nunito:wght@400;500&display=swap" />
  </noscript>

    <link rel="icon" href="/logo/company-logo.png" type="image/png" id="company-favicon" />
  <link rel="apple-touch-icon" sizes="180x180" href="/logo/company-logo.png" />

  <!-- Optimized Open Graph tags -->
  <meta property="og:title" content="Growwth Partners - Financial & Accounting Services" />   
  <meta property="og:site_name" content="Growwth Partners" />
  <meta property="og:description"
    content="Expert financial, accounting, and bookkeeping services. Get started with our CFO, finance and accounting solutions to manage and grow your business efficiently." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://growwthpartners.com/" />
  <!-- Use absolute path for OpenGraph image -->
  <meta property="og:image"
    content="https://growwthpartners.com/logo/company-logo.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:type" content="image/png" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@growwthpartners" />
  <meta name="twitter:title" content="Growwth Partners - Financial & Accounting Services" />
  <meta name="twitter:description"
    content="Expert financial, accounting, and bookkeeping services. Get started with our CFO, finance and accounting solutions to manage and grow your business efficiently." />
  <!-- Use absolute path for Twitter image as well -->
  <meta name="twitter:image"
    content="https://growwthpartners.com/logo/company-logo.png" />

  <!-- Favicon with absolute path, and Apple Touch Icon -->
  <link rel="icon" href="https://growwthpartners.com/logo/company-logo.png"
    type="image/png" />
  <link rel="growwth-partners-icon" sizes="180x180"
    href="https://growwthpartners.com/logo/company-logo.png" />

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
